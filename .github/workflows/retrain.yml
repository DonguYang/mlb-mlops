name: Retrain & Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/models/**"
      - "src/data/**"
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"  # 매일 오전 6시 KST (= UTC 21:00)

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests first
        run: pytest tests/ -v --tb=short

      - name: Download previous MLflow artifacts (if exist)
        uses: actions/download-artifact@v4
        with:
          name: mlruns
          path: mlruns/
        continue-on-error: true  # 첫 실행 시 artifacts 없어도 계속 진행

      - name: Download previous data artifacts (if exist)
        uses: actions/download-artifact@v4
        with:
          name: data
          path: data/
        continue-on-error: true

      - name: Collect historical data (최초 1회 또는 data 없을 때)
        run: |
          if [ ! -f data/raw/schedules.parquet ]; then
            echo "초기 데이터 수집 (2021 ~ 직전 시즌)"
            python -m src.data.collect
          else
            echo "기존 데이터 존재 → 당해 시즌만 갱신"
          fi

      - name: Update current season data
        run: python -c "from src.data.collect import update_current_season; update_current_season()"

      - name: Build features
        run: python -m src.data.features

      - name: Train models
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
        run: python -m src.models.train --model all

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlruns
          path: mlruns/
          retention-days: 30

      - name: Upload data artifacts
        uses: actions/upload-artifact@v4
        with:
          name: data
          path: data/
          retention-days: 30

      - name: Build Docker image
        run: docker build -t mlb-predictor:${{ github.sha }} .

      - name: Tag as latest
        run: docker tag mlb-predictor:${{ github.sha }} mlb-predictor:latest
