name: Retrain & Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/models/**"
      - "src/data/**"
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"  # 매일 오전 6시 KST (= UTC 21:00)

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 모델 파일 git push 허용
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true  # git LFS 파일(모델) 포함 checkout
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests first
        run: pytest tests/ -v --tb=short

      - name: Download previous data artifacts (if exist)
        uses: actions/download-artifact@v4
        with:
          name: data
          path: data/
        continue-on-error: true

      - name: Collect historical data (최초 1회 또는 data 없을 때)
        run: |
          if [ ! -f data/raw/schedules.parquet ]; then
            echo "초기 데이터 수집 (2021 ~ 직전 시즌)"
            python -m src.data.collect
          else
            echo "기존 데이터 존재 → 당해 시즌만 갱신"
          fi

      - name: Update current season data
        run: python -c "from src.data.collect import update_current_season; update_current_season()"

      - name: Build features
        run: python -m src.data.features

      - name: Train models
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
        run: python -m src.models.train --model all

      - name: Export production model to models/
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
        run: python -m src.models.export

      - name: Upload data artifacts
        uses: actions/upload-artifact@v4
        with:
          name: data
          path: data/
          retention-days: 30

      - name: Commit & push model to git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/production_model.pkl models/production_model_meta.json
          git diff --cached --quiet && echo "모델 변경 없음 → 스킵" || \
            git commit -m "chore: 모델 업데이트 $(date '+%Y-%m-%d') [skip ci]" && \
            git push origin main
